<!doctype html>
<html lang="ja">
<head>

  <link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@700&display=swap"

<link
  href="https://cdn.jsdelivr.net/npm/daisyui@5"

/>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
    @theme{
        --font-sans:"Noto Sans JP", sans-serif;
        --font-heading:"Zen Old Mincho", serif;
        --color-brand: #7a6a53;
        --color-brand-light: #cbb99a;
        --color-bg-cream: #f7f2ea;
        --color-text-main: #3d372d;
        --color-text-sub: #8c8272;
        --shadow-soft: 0 2px 12px rgba(61, 55, 45, 0.08);

<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<body class="bg-bg-cream text-text-main font-sans">
    <header>

            <div class="navbar-start text-white text-sm">
